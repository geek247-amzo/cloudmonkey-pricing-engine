services:
  cloudmonkey-pricing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    restart: unless-stopped

  cloudmonkey-growth-agent-worker:
    build:
      context: ./growth-agent
      dockerfile: Dockerfile
    environment:
      CM_API_URL: http://cloudmonkey-pricing-engine:3000
      GROWTH_AGENT_WORKER_TOKEN: ${GROWTH_AGENT_WORKER_TOKEN}
      CODEX_BIN: /usr/local/bin/codex
      CODEX_WORKDIR: /workspace
      GROWTH_AGENT_POLL_SECONDS: ${GROWTH_AGENT_POLL_SECONDS:-60}
    volumes:
      - growth_agent_workspace:/workspace
      - ${CODEX_BIN_PATH:-/root/.local/bin/codex}:/usr/local/bin/codex:ro
      - ${CODEX_HOME_PATH:-/root/.codex}:/root/.codex:ro
    depends_on:
      - cloudmonkey-pricing-engine
    restart: unless-stopped

volumes:
  growth_agent_workspace:
